name: Build Veolecte Loader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clone And64InlineHook
      run: |
        mkdir -p include
        git clone --depth 1 https://github.com/Rprop/And64InlineHook.git include/And64InlineHook

    - uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26b

    - name: Build native lib
      run: |
        cd cheat
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DANDROID_STL=c++_static \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Copy lib to assets
      run: |
        mkdir -p app/src/main/assets
        cp cheat/build/liboxide_cheat.so app/src/main/assets/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: gradle assembleRelease

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android \
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
          -validity 10000 -dname "CN=Veolecte,O=Veolecte,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
          --ks-key-alias androiddebugkey \
          --out veolecte-loader.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - uses: actions/upload-artifact@v4
      with:
        name: veolecte-loader
        path: veolecte-loader.apk
